name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        run: ./gradlew build packageJar --stacktrace
      - name: Start the app headless (catches missing classes at startup)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a timeout 15 java -jar build/libs/tether-demo-desktop-0.1.0-all.jar || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: tether-demo-desktop-jar
          path: build/libs/tether-demo-desktop-0.1.0-all.jar
