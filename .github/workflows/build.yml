name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        run: ./gradlew build packageJar --stacktrace
      - name: Start the app headless (catches missing classes at startup)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a timeout 15 java -jar build/libs/tether-demo-desktop-0.1.0-all.jar || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: tether-demo-desktop-jar
          path: build/libs/tether-demo-desktop-0.1.0-all.jar

  # A macOS app (.dmg) for Apple Silicon Macs, built against the SDK's main branch.
  # It is not signed, so macOS asks once before opening it (see the README).
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the .dmg
        run: ./gradlew packageDmg --stacktrace
      - name: Start the packaged app (catches modules missing from its bundled Java)
        run: |
          app=$(ls -d build/compose/binaries/main/app/*.app)
          "$app/Contents/MacOS/tether-demo" > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 $pid 2>/dev/null; then cat app.log; echo "The app quit on its own"; exit 1; fi
          kill $pid
          cat app.log
      - uses: actions/upload-artifact@v4
        with:
          name: tether-demo-macos
          path: build/compose/binaries/main/dmg/*.dmg
          compression-level: 0

  # Draws every screen with sample data (ScreenshotTest): no server or display needed.
  # Run the workflow by hand on a branch to commit the pictures to docs/screenshots.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Compose picks Noto Sans for its default sans-serif on Linux when it's installed.
      - name: Install Noto Sans
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core
      - name: Render the screens
        run: ./gradlew test --tests '*ScreenshotTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots
      - name: Commit them to docs/screenshots
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          mkdir -p docs/screenshots
          cp build/screenshots/*.png docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update screenshots"
          git push origin HEAD:${{ github.ref_name }}
