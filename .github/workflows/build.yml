name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and package
        run: ./gradlew build packageJar --stacktrace
      - name: Start the app headless (catches missing classes at startup)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a timeout 15 java -jar build/libs/tether-demo-desktop-0.1.0-all.jar || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: tether-demo-desktop-jar
          path: build/libs/tether-demo-desktop-0.1.0-all.jar

  # Draws every screen with sample data (ScreenshotTest): no server or display needed.
  # On a branch other than main, a change in the pictures is committed to docs/screenshots.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the Inter font
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          XML
          fc-match sans-serif
      - name: Render the screens
        run: ./gradlew test --tests '*ScreenshotTest*' --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/screenshots
      - name: Commit them to docs/screenshots
        if: github.event_name != 'pull_request' && github.ref_name != 'main'
        run: |
          mkdir -p docs/screenshots
          cp build/screenshots/*.png docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update screenshots"
          git push origin HEAD:${{ github.ref_name }}
