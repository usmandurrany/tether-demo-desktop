[versions]
kotlin = "2.4.20"
compose = "1.12.2"
compose-material3 = "1.9.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
conscrypt = "2.7.0"

[libraries]
tether-core = { module = "io.github.usmandurrany.tether:tether-core" }
tether-im = { module = "io.github.usmandurrany.tether:tether-im" }
tether-debug = { module = "io.github.usmandurrany.tether:tether-debug" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
conscrypt-openjdk = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref = "conscrypt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
