[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
flatlaf = "3.7.2"
conscrypt = "2.7.0"

[libraries]
tether-core = { module = "io.github.usmandurrany.tether:tether-core" }
tether-im = { module = "io.github.usmandurrany.tether:tether-im" }
tether-debug = { module = "io.github.usmandurrany.tether:tether-debug" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
conscrypt-openjdk = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref = "conscrypt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
